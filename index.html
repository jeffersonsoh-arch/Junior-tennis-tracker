<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deuce Board — Family Tennis Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="home">
  <div class="home-head">
    <div class="kicker">Junior Development Tracker</div>
    <h1>Deuce Board</h1>
    <p>One place to run both boys' training plans — session logs, skill progress, and a strategy quiz, each scaled to where they actually are.</p>
  </div>
  <div class="player-cards" id="cards"></div>
  <div class="home-foot" id="homefoot">Progress syncs to your family account. Use the <strong>Backup</strong> button inside each dashboard for an extra local copy.</div>
</div>
<div id="authgate"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabaseClient.js"></script>
<script src="assets/auth.js"></script>
<script>
function statsFromState(s){
  var doneSessions = 0, doneBadges = 0;
  var wl = (s && s.weeklyLog) || {};
  Object.keys(wl).forEach(function(wk){
    ["d1","d2","d3","d4"].forEach(function(d){ if (wl[wk][d]) doneSessions++; });
  });
  if (s && s.skillStatus){
    Object.keys(s.skillStatus).forEach(function(k){ if (s.skillStatus[k]==="mastered") doneBadges++; });
  }
  if (s && s.badgeStatus){
    Object.keys(s.badgeStatus).forEach(function(k){ if (s.badgeStatus[k]) doneBadges++; });
  }
  return {doneSessions:doneSessions, doneBadges:doneBadges};
}

function readLocalState(key){
  try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}

function cardHtml(player, name, meta, stats, totalSessions, totalBadgesOrSkills, badgeLabel, href){
  return '<a class="player-card '+player+'" href="'+href+'">'
    + '<div class="pc-name">'+name+'</div>'
    + '<div class="pc-meta">'+meta+'</div>'
    + '<div class="pc-stats">'
      + '<div class="pc-stat"><div class="v">'+stats.doneSessions+'<span style="color:var(--ink-faint);font-size:13px">/'+totalSessions+'</span></div><div class="l">Sessions Logged</div></div>'
      + '<div class="pc-stat"><div class="v">'+stats.doneBadges+'<span style="color:var(--ink-faint);font-size:13px">/'+totalBadgesOrSkills+'</span></div><div class="l">'+badgeLabel+'</div></div>'
    + '</div>'
    + '<div class="pc-enter">Open dashboard &rarr;</div>'
    + '</a>';
}

function renderCards(judahState, josephState){
  var judah = statsFromState(judahState), joseph = statsFromState(josephState);
  document.getElementById("cards").innerHTML =
    cardHtml("judah", "Judah", "Age 10 &middot; NTRP 3.5 &middot; 4x / week", judah, 208, 48, "Skills Mastered", "judah/index.html") +
    cardHtml("joseph", "Joseph", "Age 6 &middot; NTRP 2.5 &middot; 3x / week", joseph, 156, 24, "Badges Earned", "joseph/index.html");
}

function boot(client, session){
  document.getElementById("homefoot").textContent = "Signed in as " + (session.user.email || "") + ".";
  client.from("player_progress").select("player,data").eq("user_id", session.user.id)
    .then(function(res){
      if (res.error) throw res.error;
      var byPlayer = {};
      (res.data || []).forEach(function(row){ byPlayer[row.player] = row.data; });
      renderCards(byPlayer.judah || readLocalState("deuceboard_judah_v1"), byPlayer.joseph || readLocalState("deuceboard_joseph_v1"));
    })
    .catch(function(e){
      console.warn("Falling back to local progress:", e);
      renderCards(readLocalState("deuceboard_judah_v1"), readLocalState("deuceboard_joseph_v1"));
    });
}

requireAuth(boot);
</script>
</body>
</html>
